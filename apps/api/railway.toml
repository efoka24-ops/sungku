# Railway config for the Sungku API.
# In the Railway service settings, set Root Directory = apps/api so this file is used.
[build]
# Use the Dockerfile (node:20-slim + openssl) for reliable Prisma engines.
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Schema is provisioned via `prisma db push` (run from local/CI when it changes).
# The container just starts the server so it always binds the port and stays up.
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
